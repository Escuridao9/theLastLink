<a
  class="skip-link"
  href="#main-content"
  (click)="skipToContent($event)"
>
  Skip to content
</a>

<header class="site-header">
  <a class="wordmark" href="./" aria-label="The Last Link home">
    <svg
      class="brand-mark"
      viewBox="0 0 40 40"
      aria-hidden="true"
      focusable="false"
    >
      <rect
        x="4"
        y="8"
        width="23"
        height="15"
        rx="7"
        transform="rotate(-35 15 15)"
      />
      <rect
        x="14"
        y="18"
        width="23"
        height="15"
        rx="7"
        transform="rotate(-35 25 25)"
      />
    </svg>

    <span>
      <span class="wordmark-name">
        {{ title }}<span class="brand-stop" aria-hidden="true">.</span>
      </span>
      <span class="wordmark-tagline">{{ tagline }}</span>
    </span>
  </a>
</header>

<main id="main-content" class="page-content" tabindex="-1">
  <router-outlet />
</main>

<footer class="site-footer">
  <p class="footer-brand">
    {{ title }}<span class="brand-stop" aria-hidden="true">.</span>
  </p>
  <p class="footer-line">A LITTLE KNOWLEDGE. A LOT OF TROUBLE.</p>
</footer>
