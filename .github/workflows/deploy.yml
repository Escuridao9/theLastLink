name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

    permissions:
      contents: read
      pages: read

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install shared-code test dependencies
        working-directory: .
        run: npm ci

      - name: Check shared TypeScript
        working-directory: .
        run: npm run typecheck

      - name: Check Edge Function TypeScript
        working-directory: .
        run: npm run typecheck:edge

      - name: Run shared and database tests
        working-directory: .
        run: npm test

      - name: Generate and verify public configuration
        working-directory: .
        run: |
          node scripts/configure-web.mjs
          node scripts/check-public-config.mjs

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run automated tests
        run: npm test -- --watch=false

      - name: Test Edge Function handlers
        working-directory: .
        run: npm run test:edge

      - name: Read GitHub Pages configuration
        if: github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Build the production application
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base-href="${PAGES_BASE_PATH%/}/"

      - name: Upload the production application
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/dist/the-last-link/browser

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish the application
        id: deployment
        uses: actions/deploy-pages@v4
